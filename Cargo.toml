[package]
name = "vollded-ugc"
version = "1.0.0"
edition = "2021"
description = "Portable local file manager for Vollded's Roblox UGC projects by eldezaki"

[dependencies]
# Lean feature set: OpenGL renderer only, no accessibility tree, no persistence in AppData.
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
open = "5"
# Moves files/folders to the Recycle Bin (nothing is ever deleted permanently).
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Even plain `cargo run` (debug) stays fast: egui is extremely slow unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
